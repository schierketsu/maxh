<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>мера - развивай свой бизнес</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      // Диагностика белого экрана: любую ошибку загрузки/исполнения
      // показываем прямо на странице, иначе в WebView мессенджера её не
      // видно и экран просто остаётся белым.
      (function () {
        var seen = []
        function render() {
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<div style="padding:16px;font:13px/1.5 ui-monospace,monospace;color:#1c1c1e;background:#fff">' +
            '<b>мера — ошибка запуска</b><br>HTML: MERA_BUILD<br><br>' +
            seen.map(function (m) { return String(m).replace(/</g, '&lt;') }).join('<br><br>') +
            '</div>'
        }
        window.addEventListener('error', function (event) {
          var el = event.target
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
            seen.push('Не загрузился ' + el.tagName + ': ' + (el.src || el.href))
            // Один раз пробуем перезагрузиться в обход кэша — частый случай
            // это устаревший index.html, ссылающийся на удалённый бандл.
            try {
              if (!sessionStorage.getItem('mera.reloaded')) {
                sessionStorage.setItem('mera.reloaded', '1')
                location.replace(location.pathname + '?r=' + Date.now())
                return
              }
            } catch (e) {}
          } else {
            seen.push(event.message + '
  ' + (event.filename || '') + ':' + (event.lineno || ''))
          }
          render()
        }, true)
        window.addEventListener('unhandledrejection', function (event) {
          seen.push('Promise: ' + (event.reason && event.reason.message ? event.reason.message : event.reason))
          render()
        })
        // Если через 8 секунд React так и не отрисовался — тоже сообщаем.
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length === 0 && seen.length === 0) {
            seen.push('Приложение не отрисовалось за 8 с. WebApp=' + (typeof window.WebApp))
            render()
          }
        }, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
