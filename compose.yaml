# Запуск всего решения одной командой:
#
#   cp bot/.env.example bot/.env      # заполнить ключи
#   cp .env.example .env              # ключ Яндекс.Карт для сборки мини-аппа
#   docker compose up --build
#
# После старта мини-приложение доступно на http://localhost:8080,
# бот подключается к MAX сам и отвечает в чате.

services:
  # Чат-бот: long polling к MAX и HTTP API для мини-приложения в одном
  # процессе. Порт наружу не публикуется — к API ходят через miniapp,
  # который проксирует /api на этот сервис внутри сети compose.
  bot:
    build:
      context: ./bot
    env_file:
      # Один файл на всё решение: его же читают Vite и сам бот при запуске
      # без Docker. Заполняется скриптом setup-env (см. README).
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # platform-api2.max.ru требует сертификат Минцифры, которого нет в
      # стандартных хранилищах, и клиент ради него отключает проверку TLS.
      # Здесь — адрес с обычным сертификатом и работающей проверкой.
      MAX_API_BASE: https://platform-api.max.ru
      # Мини-апп ходит к API через прокси на том же адресе, так что в CORS
      # он не нуждается. Строка ниже нужна, только если открывать API с
      # другого адреса.
      ALLOWED_ORIGINS: http://localhost:8080
      # На боевом стенде бот уже ведёт long polling к MAX. Второй клиент с
      # тем же токеном делил бы апдейты с первым: ответы приходили бы то
      # дважды, то ни разу. Поэтому локально polling выключен — HTTP API
      # работает, мини-приложение проверяется целиком, а чат смотрят на
      # боевом боте по ссылке из README.
      # Включить локальный чат: BOT_POLLING=on в .env, но тогда боевой бот
      # нужно остановить.
      BOT_POLLING: ${BOT_POLLING:-off}
    # Заявки и связки аккаунтов лежат в файле: без тома они пропадут при
    # каждом пересоздании контейнера.
    volumes:
      - ./bot/data:/app/data
    restart: unless-stopped

  # Собранная статика мини-приложения плюс прокси на API бота.
  miniapp:
    build:
      context: ./miniapp
      args:
        # Vite вшивает переменные в бандл на этапе сборки. Ключ Яндекс.Карт
        # и так виден в собранном коде — это параметр сборки, а не секрет.
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        # Пусто — мини-апп обращается к API по относительному пути.
        VITE_API_BASE_URL: ""
    ports:
      # Порт можно сменить переменной MINIAPP_PORT, если 8080 занят.
      - "${MINIAPP_PORT:-8080}:8080"
    depends_on:
      - bot
    restart: unless-stopped
